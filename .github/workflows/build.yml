name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Check bundle
        run: |
          plutil -lint "build/Wallpaper Manager.app/Contents/Info.plist"
          codesign --verify --verbose "build/Wallpaper Manager.app"

      # Sets up a shuffled folder on the runner's desktop and checks the app finds the picture on screen.
      - name: End-to-end check against macOS's wallpaper shuffle
        run: |
          APP="build/Wallpaper Manager.app/Contents/MacOS/WallpaperManager"
          DIR="$HOME/Pictures/WPTest"
          mkdir -p "$DIR"
          cp "/System/Library/Desktop Pictures/Solid Colors/"*.png "$DIR/"
          swift scripts/ci/set-wallpaper-folder.swift "$DIR"
          sleep 6
          "$APP" --status | tee status.txt
          grep -q "Folder: $DIR " status.txt
          grep -q "Current picture: $DIR/" status.txt

          echo "--- after Next (restart WallpaperAgent)"
          killall WallpaperAgent
          sleep 8
          "$APP" --status | tee status-next.txt
          grep -q "Current picture: $DIR/" status-next.txt

          echo "--- CPU cost of one open-files check"
          for i in 1 2 3; do /usr/bin/time -p lsof -n -P -w -F n -c WallpaperImage > /dev/null; done

      # Temporary: measure how long macOS takes to load a new picture.
      - name: Measure latency
        run: swift scripts/ci/measure-latency.swift

      - name: Zip app
        run: ditto -c -k --keepParent "build/Wallpaper Manager.app" build/WallpaperManager.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WallpaperManager
          path: build/WallpaperManager.zip
